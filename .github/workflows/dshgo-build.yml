name: DSH Go APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (informational; version comes from pubspec)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build runtime bundle (arm64)
        run: bash runtime/build-runtime.sh arm64-v8a

      # Slim APKs do not bundle the rootfs: the manifest points at the runtime
      # release below, and the app reuses the runtime already on the phone.
      - name: Publish runtime release and point the manifest at it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MANIFEST=runtime/out/arm64-v8a/assets/runtime/manifest.json
          RTAG=$(python3 -c "import json;print('runtime-'+json.load(open('$MANIFEST'))['runtimeVersion'].split('-')[0])")
          ROOTFS=$(python3 -c "import json;print(json.load(open('$MANIFEST'))['rootfs'])")
          URL="https://github.com/${{ github.repository }}/releases/download/$RTAG/$ROOTFS"
          python3 - "$MANIFEST" "$URL" <<'EOF'
          import json, sys
          path, url = sys.argv[1], sys.argv[2]
          m = json.load(open(path))
          m['rootfsUrl'] = url
          json.dump(m, open(path, 'w'), indent=1)
          print('rootfsUrl =', url)
          EOF
          gh release view "$RTAG" >/dev/null 2>&1 || \
            gh release create "$RTAG" --prerelease --title "DSH Go runtime ${RTAG#runtime-}" \
              --notes "Linux runtime archive for slim DSH Go builds. The app downloads it once on a fresh install or a runtime change; updates reuse the copy already on the phone."
          gh release upload "$RTAG" "runtime/out/arm64-v8a/assets/runtime/$ROOTFS" "$MANIFEST" --clobber
          # Slim APK: keep the archive out of the package (uploaded above).
          mkdir -p /tmp/runtime-archives
          mv runtime/out/arm64-v8a/assets/runtime/*.tar.xz /tmp/runtime-archives/

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.DSHGO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DSHGO_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > app/android/keystore.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/app/android/keystore.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=dshgo"
            echo "keyPassword=$KS_PASS"
          } > app/android/key.properties

      - name: Analyze
        run: |
          cd app
          flutter pub get
          flutter analyze

      - name: Install NDK for tawcroot
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Build APK (slim, no bundled rootfs)
        env:
          DSH_SLIM_RUNTIME: '1'
        run: |
          ls "$ANDROID_HOME/ndk/"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          tooling/build-apk.sh --no-companion --no-star

      - name: Publish app release (APK + update.json for in-app updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)
          cat > notes.md <<EOF
          ## DSH Go $VERSION

          - In-app updates: future versions download inside the app (Settings → About → Check for updates), with small delta patches when possible. No more full-size downloads for every update.
          - Smaller APK: the Linux runtime is no longer bundled in every update. The copy already on your phone is reused; a fresh install downloads it once.
          - Home screen restored: provider chips removed from chat; providers now live in Settings only.
          - Settings quick connect keeps one-tap key setup, shows free models only, and Auto (Free) picks the best available free model with fallback.
          - Voice call fixes: Gemini transcription/TTS path repaired, with clear English errors and fallback voice if Gemini voice fails.
          - English sweep: plugin and engine-served UI text is forced to English.
          EOF
          python3 tooling/release_assets.py --notes notes.md --delta-from 3
          ls -la dist/
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* --title "DSH Go $VERSION" --notes-file notes.md
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dshgo-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
