name: DSH Go APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build runtime bundle (arm64)
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.DSHGO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DSHGO_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > app/android/keystore.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/app/android/keystore.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=dshgo"
            echo "keyPassword=$KS_PASS"
          } > app/android/key.properties

      - name: Analyze
        run: |
          cd app
          flutter pub get
          flutter analyze

      - name: Build APK
        run: tooling/build-apk.sh --no-companion --no-star

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dshgo-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
